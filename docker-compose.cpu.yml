version: '3.8'

# ===========================================
# Broadlistening - CPU版（GPU不要）
# ===========================================
#
# 起動: docker-compose -f docker-compose.cpu.yml up -d
# 停止: docker-compose -f docker-compose.cpu.yml down
#
# 事前準備:
#   1. web/ ディレクトリにindex.htmlを配置
#   2. 初回起動時にHuggingFaceからモデルが自動ダウンロードされます（約5GB）
#   3. .envファイルでN8N_PASSWORDを設定（デフォルト: changeme）
#

services:
  # ===================
  # 意見収集（Forgejo）
  # ===================
  forgejo:
    image: codeberg.org/forgejo/forgejo:9
    container_name: broadlistening-forgejo
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__server__ROOT_URL=http://localhost:3000/
    volumes:
      - forgejo_data:/data
    ports:
      - "3000:3000"   # Web UI
      - "2222:22"     # SSH
    restart: unless-stopped
    networks:
      - broadlistening

  # ===================
  # ベクトルDB（Qdrant）
  # ===================
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: broadlistening-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    restart: unless-stopped
    networks:
      - broadlistening
    deploy:
      resources:
        limits:
          memory: 1G

  # ===================
  # LLM - 分類・要約（LFM2.5）Transformersベース
  # ===================
  llm:
    build:
      context: .
      dockerfile: Dockerfile.lfm25-transformers
    container_name: broadlistening-llm
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    ports:
      - "8080:8080"
    environment:
      - MODEL_ID=LiquidAI/LFM2.5-1.2B-JP
      - DEVICE=cpu
      - MAX_LENGTH=2048
      - PORT=8080
    restart: unless-stopped
    networks:
      - broadlistening
    deploy:
      resources:
        limits:
          memory: 4G
    # Initial model download may take time
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 300s

  # ===================
  # Embedding生成（bge-m3）
  # ===================
  embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.2
    container_name: broadlistening-embedding
    volumes:
      - embedding_cache:/data
    ports:
      - "8081:80"
    command: --model-id BAAI/bge-m3
    restart: unless-stopped
    networks:
      - broadlistening

  # ===================
  # パイプライン自動化（n8n）
  # ===================
  n8n:
    image: n8nio/n8n:1.70.1
    container_name: broadlistening-n8n
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-changeme}
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "5678:5678"
    restart: unless-stopped
    networks:
      - broadlistening
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      - qdrant
      - llm
      - embedding

  # ===================
  # Web UI - 可視化（nginx + vis.js）
  # ===================
  web:
    image: nginx:alpine
    container_name: broadlistening-web
    volumes:
      - ./web:/usr/share/nginx/html:ro
    ports:
      - "8000:80"
    restart: unless-stopped
    networks:
      - broadlistening

networks:
  broadlistening:
    driver: bridge

volumes:
  forgejo_data:
  qdrant_data:
  n8n_data:
  embedding_cache:
  huggingface_cache:
