<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>意見投稿 - Broadlistening</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      line-height: 1.6;
      min-height: 100vh;
    }
    header {
      background: #16213e;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 500;
    }
    nav {
      display: flex;
      gap: 1.5rem;
    }
    nav a {
      color: #4ecca3;
      text-decoration: none;
    }
    nav a:hover {
      text-decoration: underline;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem;
    }
    .form-section {
      background: #16213e;
      border-radius: 8px;
      padding: 2rem;
      margin-bottom: 1.5rem;
    }
    .section-title {
      font-size: 1.3rem;
      color: #4ecca3;
      margin-bottom: 1.5rem;
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
    }
    .label-hint {
      font-size: 0.85rem;
      color: #888;
      font-weight: normal;
    }
    input[type="text"],
    textarea,
    select {
      width: 100%;
      padding: 0.8rem 1rem;
      background: #1a1a2e;
      border: 1px solid #333;
      border-radius: 6px;
      color: #eee;
      font-size: 1rem;
      font-family: inherit;
    }
    input[type="text"]:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: #4ecca3;
    }
    textarea {
      min-height: 150px;
      resize: vertical;
    }
    select {
      cursor: pointer;
    }
    select option {
      background: #1a1a2e;
      color: #eee;
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    .submit-btn {
      background: #4ecca3;
      color: #1a1a2e;
      border: none;
      padding: 1rem 2rem;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    .submit-btn:hover {
      background: #3db892;
    }
    .submit-btn:disabled {
      background: #555;
      cursor: not-allowed;
    }
    .message {
      padding: 1rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      display: none;
    }
    .message.success {
      background: #2ecc7120;
      border: 1px solid #2ecc71;
      color: #2ecc71;
    }
    .message.error {
      background: #e74c3c20;
      border: 1px solid #e74c3c;
      color: #e74c3c;
    }
    .privacy-notice {
      background: #1a1a2e;
      padding: 1rem;
      border-radius: 6px;
      font-size: 0.85rem;
      color: #888;
    }
    .privacy-notice h3 {
      color: #ccc;
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
    }
    .char-count {
      text-align: right;
      font-size: 0.85rem;
      color: #888;
      margin-top: 0.3rem;
    }
    .char-count.warning {
      color: #f39c12;
    }
    .char-count.error {
      color: #e74c3c;
    }
    @media (max-width: 768px) {
      .container {
        padding: 1rem;
      }
      .form-section {
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>📝 意見投稿</h1>
    <nav>
      <a href="index.html">意見マップ</a>
      <a href="clusters.html">クラスタ要約</a>
      <a href="voting.html">投票分析</a>
      <a href="reports.html">週次レポート</a>
    </nav>
  </header>

  <div class="container">
    <div id="success-message" class="message success">
      ご意見を投稿しました。ありがとうございます。
    </div>
    <div id="error-message" class="message error">
      投稿に失敗しました。しばらくしてから再度お試しください。
    </div>

    <form id="opinion-form" class="form-section">
      <h2 class="section-title">ご意見・ご提案をお聞かせください</h2>

      <div class="form-group">
        <label for="title">
          タイトル
          <span class="label-hint">（簡潔に要約してください）</span>
        </label>
        <input type="text" id="title" name="title" maxlength="100" required
               placeholder="例: 会議室の予約システムを改善してほしい">
        <div class="char-count"><span id="title-count">0</span>/100</div>
      </div>

      <div class="form-group">
        <label for="body">
          詳細
          <span class="label-hint">（具体的な状況や提案内容を記載してください）</span>
        </label>
        <textarea id="body" name="body" maxlength="5000" required
                  placeholder="例: 現在の会議室予約システムは使いづらく、空き状況が分かりにくいです。カレンダー形式で一覧表示できるようにしていただけると助かります。"></textarea>
        <div class="char-count"><span id="body-count">0</span>/5000</div>
      </div>

      <div class="form-group">
        <label for="category">カテゴリ</label>
        <select id="category" name="category">
          <option value="">選択してください（任意）</option>
          <option value="問題提起">問題提起 - 困っていること、課題</option>
          <option value="提案">提案 - 改善案、アイデア</option>
          <option value="質問">質問 - 確認したいこと</option>
          <option value="その他">その他</option>
        </select>
      </div>

      <div class="form-group">
        <label for="nickname">
          ニックネーム
          <span class="label-hint">（任意・匿名でも投稿できます）</span>
        </label>
        <input type="text" id="nickname" name="nickname" maxlength="50"
               placeholder="匿名">
      </div>

      <div class="form-group">
        <div class="checkbox-group">
          <input type="checkbox" id="agree" name="agree" required>
          <label for="agree" style="margin-bottom: 0;">
            投稿内容が分析・可視化されることに同意します
          </label>
        </div>
      </div>

      <div class="privacy-notice">
        <h3>プライバシーについて</h3>
        <p>
          投稿された意見は匿名化処理され、個人を特定できる形では公開されません。
          意見の内容はAIによる分析・分類が行われ、類似の意見とグループ化されて可視化されます。
        </p>
      </div>

      <button type="submit" class="submit-btn" id="submit-btn">
        意見を投稿する
      </button>
    </form>
  </div>

  <script>
    // 設定（環境に応じて変更）
    const CONFIG = {
      webhookUrl: '/api/webhook/submit-opinion',
      maxTitleLength: 100,
      maxBodyLength: 5000
    };

    // DOM要素
    const form = document.getElementById('opinion-form');
    const titleInput = document.getElementById('title');
    const bodyInput = document.getElementById('body');
    const titleCount = document.getElementById('title-count');
    const bodyCount = document.getElementById('body-count');
    const submitBtn = document.getElementById('submit-btn');
    const successMessage = document.getElementById('success-message');
    const errorMessage = document.getElementById('error-message');

    // 文字数カウント更新
    function updateCharCount(input, countEl, max) {
      const len = input.value.length;
      countEl.textContent = len;

      const parent = countEl.parentElement;
      parent.classList.remove('warning', 'error');

      if (len > max * 0.9) {
        parent.classList.add('error');
      } else if (len > max * 0.7) {
        parent.classList.add('warning');
      }
    }

    titleInput.addEventListener('input', () => {
      updateCharCount(titleInput, titleCount, CONFIG.maxTitleLength);
    });

    bodyInput.addEventListener('input', () => {
      updateCharCount(bodyInput, bodyCount, CONFIG.maxBodyLength);
    });

    // XSS対策: 入力値のサニタイズ
    function sanitizeInput(str) {
      if (!str) return '';
      return String(str).trim();
    }

    // フォーム送信
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      // UI更新
      submitBtn.disabled = true;
      submitBtn.textContent = '送信中...';
      successMessage.style.display = 'none';
      errorMessage.style.display = 'none';

      try {
        const data = {
          title: sanitizeInput(titleInput.value),
          body: sanitizeInput(bodyInput.value),
          category: document.getElementById('category').value || null,
          nickname: sanitizeInput(document.getElementById('nickname').value) || '匿名',
          source: {
            type: 'web_form',
            submitted_at: new Date().toISOString(),
            user_agent: navigator.userAgent
          }
        };

        const response = await fetch(CONFIG.webhookUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(data)
        });

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        // 成功
        successMessage.style.display = 'block';
        form.reset();
        titleCount.textContent = '0';
        bodyCount.textContent = '0';

        // 3秒後にメッセージを非表示
        setTimeout(() => {
          successMessage.style.display = 'none';
        }, 5000);

      } catch (error) {
        console.error('送信エラー:', error);
        errorMessage.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '意見を投稿する';
      }
    });
  </script>
</body>
</html>
