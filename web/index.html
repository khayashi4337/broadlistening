<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Broadlistening - 意見マップ</title>
  <!-- vis-network: バージョン固定でセキュリティ向上 -->
  <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
    }
    header {
      background: #16213e;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 500;
    }
    nav {
      display: flex;
      gap: 1.5rem;
    }
    nav a {
      color: #4ecca3;
      text-decoration: none;
    }
    nav a:hover {
      text-decoration: underline;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 2rem;
    }
    .stats {
      display: flex;
      gap: 2rem;
      font-size: 0.9rem;
    }
    .stat {
      text-align: center;
    }
    .stat-value {
      font-size: 1.5rem;
      font-weight: bold;
      color: #4ecca3;
    }
    .container {
      display: flex;
      height: calc(100vh - 60px);
    }
    #graph {
      flex: 1;
      background: #1a1a2e;
    }
    .sidebar {
      width: 350px;
      background: #16213e;
      padding: 1rem;
      overflow-y: auto;
    }
    .sidebar h2 {
      font-size: 1rem;
      margin-bottom: 1rem;
      color: #4ecca3;
    }
    .issue-card {
      background: #1a1a2e;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 0.5rem;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .issue-card:hover {
      transform: translateX(4px);
    }
    .issue-title {
      font-weight: 500;
      margin-bottom: 0.5rem;
    }
    .issue-meta {
      font-size: 0.8rem;
      color: #888;
      display: flex;
      gap: 1rem;
    }
    .tag {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      margin-right: 0.3rem;
    }
    .tag-theme { background: #4ecca3; color: #1a1a2e; }
    .tag-proposal { background: #3498db; }
    .tag-problem { background: #e74c3c; }
    .tag-question { background: #f39c12; }
    .cluster-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.8rem;
    }
    .legend-color {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <header>
    <h1>🗣️ Broadlistening - 意見マップ</h1>
    <div class="header-right">
      <nav>
        <a href="index.html">意見マップ</a>
        <a href="clusters.html">クラスタ要約</a>
        <a href="voting.html">投票分析</a>
        <a href="reports.html">週次レポート</a>
        <a href="submit.html">意見投稿</a>
      </nav>
      <div class="stats">
        <div class="stat">
          <div class="stat-value" id="total-count">0</div>
          <div>総意見数</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="cluster-count">0</div>
          <div>クラスタ数</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="today-count">0</div>
          <div>本日の投稿</div>
        </div>
      </div>
    </div>
  </header>

  <div class="container">
    <div id="graph"></div>
    <div class="sidebar">
      <h2>クラスタ</h2>
      <div class="cluster-legend" id="legend"></div>
      
      <h2>選択中のIssue</h2>
      <div id="selected-issue">
        <p style="color: #888; font-size: 0.9rem;">ノードをクリックすると詳細が表示されます</p>
      </div>
      
      <h2 style="margin-top: 1rem;">最新の意見</h2>
      <div id="recent-issues"></div>
    </div>
  </div>

  <script>
    // XSS対策: HTMLエスケープ関数
    const escapeHTML = (str) => {
      if (str == null) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    };

    // デフォルトのクラスタ色
    const CLUSTER_COLORS = [
      '#e74c3c', '#3498db', '#2ecc71', '#9b59b6', '#f39c12',
      '#1abc9c', '#e67e22', '#34495e', '#16a085', '#c0392b'
    ];

    // 意見タイプのマッピング
    const TYPE_MAPPING = {
      '問題提起': 'problem',
      '提案': 'proposal',
      '質問': 'question',
      'その他': 'other'
    };

    // サンプルデータ（データがない場合のフォールバック）
    const sampleData = {
      clusters: [
        { id: "example", label: "サンプル", color: "#4ecca3" }
      ],
      issues: [
        { id: 1, title: "データを読み込み中...", cluster: "example", type: "other", reactions: { up: 0, down: 0 } }
      ]
    };

    // グローバル変数
    let currentData = null;
    let network = null;
    let nodes = [];
    let edges = [];

    // データ読み込み関数
    async function loadData() {
      try {
        const response = await fetch('data/issues.json');
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        const data = await response.json();

        // データが空の場合はサンプルデータを使用
        if (!data.issues || data.issues.length === 0) {
          console.log('データが空のため、サンプルデータを使用します');
          return transformData(sampleData);
        }

        return transformData(data);
      } catch (error) {
        console.error('データの読み込みに失敗しました:', error);
        return transformData(sampleData);
      }
    }

    // データ変換関数（issues.jsonのフォーマットを内部形式に変換）
    function transformData(data) {
      // クラスタがある場合はそのまま使用、なければテーマから生成
      let clusters = data.clusters || [];

      if (clusters.length === 0 && data.issues && data.issues.length > 0) {
        // issuesからテーマを収集してクラスタを生成
        const themeSet = new Set();
        data.issues.forEach(issue => {
          if (issue.themes && Array.isArray(issue.themes)) {
            issue.themes.forEach(theme => themeSet.add(theme));
          }
          if (issue.opinion_type) {
            themeSet.add(issue.opinion_type);
          }
        });

        clusters = Array.from(themeSet).map((theme, index) => ({
          id: `cluster-${index}`,
          label: theme,
          color: CLUSTER_COLORS[index % CLUSTER_COLORS.length]
        }));
      }

      // issuesを内部形式に変換
      const issues = (data.issues || []).map(issue => {
        // クラスタの決定（themes[0]を使用、なければopinion_type）
        let clusterId = 'unknown';
        if (issue.themes && issue.themes.length > 0) {
          const cluster = clusters.find(c => c.label === issue.themes[0]);
          clusterId = cluster ? cluster.id : 'unknown';
        } else if (issue.opinion_type) {
          const cluster = clusters.find(c => c.label === issue.opinion_type);
          clusterId = cluster ? cluster.id : 'unknown';
        }

        return {
          id: issue.id || issue.issue_id,
          title: issue.title || issue.metadata?.title || '無題',
          body: issue.body || issue.metadata?.body || '',
          cluster: clusterId,
          type: TYPE_MAPPING[issue.opinion_type] || 'other',
          themes: issue.themes || [],
          reactions: issue.reactions || { up: 0, down: 0 },
          url: issue.url || issue.metadata?.url || '#',
          created_at: issue.created_at || issue.metadata?.created_at || null
        };
      });

      // unknownクラスタを追加（必要な場合）
      if (issues.some(i => i.cluster === 'unknown') && !clusters.find(c => c.id === 'unknown')) {
        clusters.push({ id: 'unknown', label: '未分類', color: '#888888' });
      }

      return { clusters, issues };
    }

    // 統計更新関数
    function updateStats(data) {
      document.getElementById('total-count').textContent = data.issues.length;
      document.getElementById('cluster-count').textContent = data.clusters.length;

      // 本日の投稿数を計算
      const today = new Date().toISOString().split('T')[0];
      const todayCount = data.issues.filter(issue => {
        if (!issue.created_at) return false;
        return issue.created_at.startsWith(today);
      }).length;
      document.getElementById('today-count').textContent = todayCount;
    }

    // 凡例生成関数
    function renderLegend(clusters) {
      const legendEl = document.getElementById('legend');
      legendEl.innerHTML = '';
      clusters.forEach(cluster => {
        legendEl.innerHTML += `
          <div class="legend-item">
            <div class="legend-color" style="background: ${escapeHTML(cluster.color)}"></div>
            <span>${escapeHTML(cluster.label)}</span>
          </div>
        `;
      });
    }

    // グラフ描画関数
    function renderGraph(data) {
      nodes = [];
      edges = [];

      // クラスタノード
      data.clusters.forEach(cluster => {
        nodes.push({
          id: cluster.id,
          label: cluster.label,
          shape: 'box',
          color: { background: cluster.color, border: cluster.color },
          font: { color: '#fff', size: 14 },
          margin: 10
        });
      });

      // Issueノード
      data.issues.forEach(issue => {
        const cluster = data.clusters.find(c => c.id === issue.cluster);
        if (!cluster) return;

        const reactionScore = (issue.reactions?.up || 0) - (issue.reactions?.down || 0);
        nodes.push({
          id: `issue-${issue.id}`,
          label: issue.title.substring(0, 15) + (issue.title.length > 15 ? '...' : ''),
          title: issue.title,
          shape: 'dot',
          size: Math.max(8, 10 + reactionScore / 5),
          color: { background: cluster.color, border: '#fff' },
          issueData: issue
        });
        edges.push({
          from: `issue-${issue.id}`,
          to: issue.cluster,
          color: { color: cluster.color, opacity: 0.3 }
        });
      });

      // グラフ描画
      const container = document.getElementById('graph');
      const graphData = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
      const options = {
        physics: {
          stabilization: { iterations: 100 },
          barnesHut: { gravitationalConstant: -3000, springLength: 150 }
        },
        interaction: { hover: true, tooltipDelay: 100 }
      };

      network = new vis.Network(container, graphData, options);

      // クリックイベント
      network.on('click', params => {
        if (params.nodes.length > 0) {
          const nodeId = params.nodes[0];
          if (nodeId.startsWith('issue-')) {
            const node = nodes.find(n => n.id === nodeId);
            if (node && node.issueData) {
              showIssueDetail(node.issueData, data.clusters);
            }
          }
        }
      });
    }

    // Issue詳細表示関数
    function showIssueDetail(issue, clusters) {
      const typeLabel = { problem: '問題提起', proposal: '提案', question: '質問', other: 'その他' };
      const typeClass = { problem: 'tag-problem', proposal: 'tag-proposal', question: 'tag-question', other: 'tag-theme' };
      const cluster = clusters.find(c => c.id === issue.cluster);

      document.getElementById('selected-issue').innerHTML = `
        <div class="issue-card">
          <div class="issue-title">${escapeHTML(issue.title)}</div>
          <div style="margin: 0.5rem 0;">
            ${cluster ? `<span class="tag tag-theme">${escapeHTML(cluster.label)}</span>` : ''}
            <span class="tag ${escapeHTML(typeClass[issue.type] || 'tag-theme')}">${escapeHTML(typeLabel[issue.type] || 'その他')}</span>
          </div>
          ${issue.themes && issue.themes.length > 0 ? `
            <div style="margin: 0.5rem 0;">
              ${issue.themes.map(t => `<span class="tag tag-theme">${escapeHTML(t)}</span>`).join('')}
            </div>
          ` : ''}
          <div class="issue-meta">
            <span>👍 ${escapeHTML(String(issue.reactions?.up || 0))}</span>
            <span>👎 ${escapeHTML(String(issue.reactions?.down || 0))}</span>
            ${issue.url && issue.url !== '#' ? `<a href="${escapeHTML(issue.url)}" target="_blank" style="color: #4ecca3;">詳細</a>` : ''}
          </div>
        </div>
      `;
    }

    // 最新の意見表示関数
    function renderRecentIssues(data) {
      const recentEl = document.getElementById('recent-issues');
      recentEl.innerHTML = '';

      // 最新5件を表示（created_atでソート）
      const sortedIssues = [...data.issues].sort((a, b) => {
        if (!a.created_at) return 1;
        if (!b.created_at) return -1;
        return new Date(b.created_at) - new Date(a.created_at);
      });

      sortedIssues.slice(0, 5).forEach(issue => {
        const cluster = data.clusters.find(c => c.id === issue.cluster);
        const card = document.createElement('div');
        card.className = 'issue-card';
        card.dataset.issueId = issue.id;
        card.innerHTML = `
          <div class="issue-title">${escapeHTML(issue.title)}</div>
          <div class="issue-meta">
            ${cluster ? `<span class="tag tag-theme">${escapeHTML(cluster.label)}</span>` : ''}
            <span>👍 ${escapeHTML(String(issue.reactions?.up || 0))}</span>
          </div>
        `;
        card.addEventListener('click', () => {
          showIssueDetail(issue, currentData.clusters);
        });
        recentEl.appendChild(card);
      });
    }

    // 初期化
    async function init() {
      currentData = await loadData();
      updateStats(currentData);
      renderLegend(currentData.clusters);
      renderGraph(currentData);
      renderRecentIssues(currentData);
    }

    // ページ読み込み時に初期化
    init();

    // 定期的にデータを更新（30秒ごと）
    setInterval(async () => {
      const newData = await loadData();
      if (JSON.stringify(newData) !== JSON.stringify(currentData)) {
        currentData = newData;
        updateStats(currentData);
        renderLegend(currentData.clusters);
        renderGraph(currentData);
        renderRecentIssues(currentData);
      }
    }, 30000);
  </script>
</body>
</html>
