<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>意見マップ - 公開ダッシュボード</title>
  <meta name="description" content="市民・社員の意見を可視化した公開ダッシュボード">
  <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
    }
    header {
      background: linear-gradient(135deg, #16213e 0%, #1f2b47 100%);
      padding: 1.5rem 2rem;
      text-align: center;
      border-bottom: 2px solid #4ecca3;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
    }
    .subtitle {
      color: #888;
      font-size: 0.95rem;
    }
    .dashboard-container {
      display: grid;
      grid-template-columns: 1fr 350px;
      height: calc(100vh - 120px);
    }
    .main-panel {
      display: flex;
      flex-direction: column;
    }
    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 3rem;
      padding: 1rem 2rem;
      background: #16213e;
      border-bottom: 1px solid #333;
    }
    .stat-item {
      text-align: center;
    }
    .stat-value {
      font-size: 2rem;
      font-weight: bold;
      color: #4ecca3;
    }
    .stat-label {
      font-size: 0.85rem;
      color: #888;
    }
    #graph {
      flex: 1;
      background: #1a1a2e;
    }
    .side-panel {
      background: #16213e;
      padding: 1.5rem;
      overflow-y: auto;
      border-left: 1px solid #333;
    }
    .panel-section {
      margin-bottom: 1.5rem;
    }
    .panel-title {
      font-size: 1rem;
      color: #4ecca3;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid #333;
    }
    .cluster-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .cluster-item {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.6rem;
      background: #1a1a2e;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .cluster-item:hover {
      transform: translateX(4px);
    }
    .cluster-color {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .cluster-info {
      flex: 1;
      min-width: 0;
    }
    .cluster-name {
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cluster-count {
      font-size: 0.75rem;
      color: #888;
    }
    .recent-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .recent-item {
      padding: 0.8rem;
      background: #1a1a2e;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .recent-item:hover {
      transform: translateX(4px);
    }
    .recent-title {
      font-size: 0.9rem;
      margin-bottom: 0.3rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .recent-meta {
      font-size: 0.75rem;
      color: #888;
    }
    .detail-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .detail-modal.active {
      display: flex;
    }
    .detail-content {
      background: #16213e;
      padding: 2rem;
      border-radius: 12px;
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }
    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
    }
    .detail-title {
      font-size: 1.2rem;
      color: #4ecca3;
    }
    .detail-close {
      background: none;
      border: none;
      color: #888;
      font-size: 1.5rem;
      cursor: pointer;
    }
    .detail-close:hover {
      color: #fff;
    }
    .detail-body {
      line-height: 1.8;
      margin-bottom: 1rem;
    }
    .detail-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .tag {
      padding: 0.3rem 0.6rem;
      border-radius: 4px;
      font-size: 0.8rem;
    }
    .tag-theme { background: #4ecca3; color: #1a1a2e; }
    .tag-type { background: #3498db; }
    .detail-reactions {
      display: flex;
      gap: 1.5rem;
      color: #888;
    }
    footer {
      background: #16213e;
      padding: 1rem 2rem;
      text-align: center;
      font-size: 0.85rem;
      color: #888;
      border-top: 1px solid #333;
    }
    footer a {
      color: #4ecca3;
      text-decoration: none;
    }
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      color: #888;
    }
    @media (max-width: 768px) {
      .dashboard-container {
        grid-template-columns: 1fr;
        height: auto;
      }
      .main-panel {
        height: 60vh;
      }
      .side-panel {
        border-left: none;
        border-top: 1px solid #333;
      }
      .stats-bar {
        flex-wrap: wrap;
        gap: 1rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>意見マップ</h1>
    <p class="subtitle">みんなの声を可視化</p>
  </header>

  <div class="dashboard-container">
    <div class="main-panel">
      <div class="stats-bar">
        <div class="stat-item">
          <div class="stat-value" id="total-opinions">-</div>
          <div class="stat-label">総意見数</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="total-clusters">-</div>
          <div class="stat-label">トピック数</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="total-votes">-</div>
          <div class="stat-label">総投票数</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="consensus-rate">-</div>
          <div class="stat-label">合意度</div>
        </div>
      </div>
      <div id="graph">
        <div class="loading">読み込み中...</div>
      </div>
    </div>

    <div class="side-panel">
      <div class="panel-section">
        <h2 class="panel-title">トピック一覧</h2>
        <div class="cluster-list" id="cluster-list"></div>
      </div>

      <div class="panel-section">
        <h2 class="panel-title">最新の意見</h2>
        <div class="recent-list" id="recent-list"></div>
      </div>
    </div>
  </div>

  <div class="detail-modal" id="detail-modal">
    <div class="detail-content">
      <div class="detail-header">
        <h3 class="detail-title" id="detail-title"></h3>
        <button class="detail-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="detail-body" id="detail-body"></div>
      <div class="detail-tags" id="detail-tags"></div>
      <div class="detail-reactions" id="detail-reactions"></div>
    </div>
  </div>

  <footer>
    <p>Powered by <a href="https://github.com/khayashi4337/broadlistening" target="_blank">Broadlistening</a></p>
  </footer>

  <script>
    // XSS対策
    const escapeHTML = (str) => {
      if (str == null) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    };

    const CLUSTER_COLORS = [
      '#e74c3c', '#3498db', '#2ecc71', '#9b59b6', '#f39c12',
      '#1abc9c', '#e67e22', '#34495e', '#16a085', '#c0392b'
    ];

    let allData = { issues: [], clusters: [] };
    let network = null;

    // データ読み込み
    async function loadData() {
      try {
        const [issuesRes, clustersRes, votingRes] = await Promise.all([
          fetch('../data/issues.json').catch(() => ({ ok: false })),
          fetch('../data/clusters.json').catch(() => ({ ok: false })),
          fetch('../data/voting.json').catch(() => ({ ok: false }))
        ]);

        const issues = issuesRes.ok ? await issuesRes.json() : { issues: [] };
        const clusters = clustersRes.ok ? await clustersRes.json() : { clusters: [] };
        const voting = votingRes.ok ? await votingRes.json() : { summary: {} };

        return { issues, clusters, voting };
      } catch (error) {
        console.error('データ読み込みエラー:', error);
        return { issues: { issues: [] }, clusters: { clusters: [] }, voting: { summary: {} } };
      }
    }

    // 統計更新
    function updateStats(data) {
      const issueCount = data.issues?.issues?.length || 0;
      const clusterCount = data.clusters?.clusters?.length || 0;
      const totalVotes = data.voting?.summary?.total_votes || 0;
      const consensus = data.voting?.summary?.overall_consensus || 0;

      document.getElementById('total-opinions').textContent = issueCount;
      document.getElementById('total-clusters').textContent = clusterCount;
      document.getElementById('total-votes').textContent = totalVotes;
      document.getElementById('consensus-rate').textContent = Math.round(consensus * 100) + '%';
    }

    // クラスタリスト描画
    function renderClusterList(clusters) {
      const container = document.getElementById('cluster-list');
      if (!clusters || clusters.length === 0) {
        container.innerHTML = '<p style="color: #888; font-size: 0.9rem;">データがありません</p>';
        return;
      }

      container.innerHTML = clusters.slice(0, 8).map((cluster, i) => `
        <div class="cluster-item" data-cluster-id="${cluster.id || i}">
          <div class="cluster-color" style="background: ${CLUSTER_COLORS[i % CLUSTER_COLORS.length]}"></div>
          <div class="cluster-info">
            <div class="cluster-name">${escapeHTML(cluster.label)}</div>
            <div class="cluster-count">${cluster.count || 0}件</div>
          </div>
        </div>
      `).join('');
    }

    // 最新意見リスト描画
    function renderRecentList(issues) {
      const container = document.getElementById('recent-list');
      if (!issues || issues.length === 0) {
        container.innerHTML = '<p style="color: #888; font-size: 0.9rem;">データがありません</p>';
        return;
      }

      const sorted = [...issues].sort((a, b) => {
        const dateA = a.created_at || a.metadata?.created_at || '';
        const dateB = b.created_at || b.metadata?.created_at || '';
        return dateB.localeCompare(dateA);
      });

      container.innerHTML = sorted.slice(0, 5).map(issue => {
        const title = issue.title || issue.metadata?.title || '無題';
        const type = issue.opinion_type || 'その他';
        return `
          <div class="recent-item" data-issue='${escapeHTML(JSON.stringify(issue))}'>
            <div class="recent-title">${escapeHTML(title)}</div>
            <div class="recent-meta">${escapeHTML(type)}</div>
          </div>
        `;
      }).join('');

      // クリックイベント
      container.querySelectorAll('.recent-item').forEach(item => {
        item.addEventListener('click', () => {
          const issue = JSON.parse(item.dataset.issue);
          showDetail(issue);
        });
      });
    }

    // グラフ描画
    function renderGraph(data) {
      const container = document.getElementById('graph');
      container.innerHTML = '';

      const clusters = data.clusters?.clusters || [];
      const issues = data.issues?.issues || [];

      if (clusters.length === 0 && issues.length === 0) {
        container.innerHTML = '<div class="loading">データがありません</div>';
        return;
      }

      const nodes = [];
      const edges = [];

      // クラスタノード
      clusters.forEach((cluster, i) => {
        nodes.push({
          id: `cluster-${cluster.id || i}`,
          label: cluster.label,
          shape: 'box',
          color: { background: CLUSTER_COLORS[i % CLUSTER_COLORS.length], border: CLUSTER_COLORS[i % CLUSTER_COLORS.length] },
          font: { color: '#fff', size: 14 },
          margin: 10
        });
      });

      // Issueノード（最大100件）
      issues.slice(0, 100).forEach((issue, idx) => {
        const title = issue.title || issue.metadata?.title || '無題';
        const clusterId = issue.cluster_id || 0;
        const clusterColor = CLUSTER_COLORS[clusterId % CLUSTER_COLORS.length];

        nodes.push({
          id: `issue-${issue.id || idx}`,
          label: title.substring(0, 12) + (title.length > 12 ? '...' : ''),
          title: title,
          shape: 'dot',
          size: 8,
          color: { background: clusterColor, border: '#fff' },
          issueData: issue
        });

        if (clusters.length > 0) {
          edges.push({
            from: `issue-${issue.id || idx}`,
            to: `cluster-${clusterId}`,
            color: { color: clusterColor, opacity: 0.3 }
          });
        }
      });

      const graphData = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
      const options = {
        physics: {
          stabilization: { iterations: 100 },
          barnesHut: { gravitationalConstant: -2000, springLength: 120 }
        },
        interaction: { hover: true, tooltipDelay: 100 }
      };

      network = new vis.Network(container, graphData, options);

      network.on('click', params => {
        if (params.nodes.length > 0) {
          const nodeId = params.nodes[0];
          if (nodeId.startsWith('issue-')) {
            const node = nodes.find(n => n.id === nodeId);
            if (node && node.issueData) {
              showDetail(node.issueData);
            }
          }
        }
      });
    }

    // 詳細モーダル表示
    function showDetail(issue) {
      const title = issue.title || issue.metadata?.title || '無題';
      const body = issue.body || issue.metadata?.body || '';
      const themes = issue.themes || [];
      const type = issue.opinion_type || 'その他';
      const reactions = issue.reactions || { up: 0, down: 0 };

      document.getElementById('detail-title').textContent = title;
      document.getElementById('detail-body').textContent = body;

      const tagsHtml = [
        `<span class="tag tag-type">${escapeHTML(type)}</span>`,
        ...themes.map(t => `<span class="tag tag-theme">${escapeHTML(t)}</span>`)
      ].join('');
      document.getElementById('detail-tags').innerHTML = tagsHtml;

      document.getElementById('detail-reactions').innerHTML = `
        <span>👍 ${reactions.up || 0}</span>
        <span>👎 ${reactions.down || 0}</span>
      `;

      document.getElementById('detail-modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('detail-modal').classList.remove('active');
    }

    // モーダル外クリックで閉じる
    document.getElementById('detail-modal').addEventListener('click', (e) => {
      if (e.target.id === 'detail-modal') {
        closeModal();
      }
    });

    // 初期化
    async function init() {
      const data = await loadData();
      allData = data;

      updateStats(data);
      renderClusterList(data.clusters?.clusters || []);
      renderRecentList(data.issues?.issues || []);
      renderGraph(data);
    }

    init();

    // 定期更新（5分ごと）
    setInterval(init, 300000);
  </script>
</body>
</html>
